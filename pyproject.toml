[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imageharbor"
version = "0.1.0"
description = "Deterministic, resumable photo organization system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "Pillow>=10.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
faces = [
    "onnxruntime>=1.17,<2",
    # Upper-bounded at <2.3: numpy 2.3+ ships __init__.pyi using the PEP 695
    # `type` statement unconditionally (no sys.version_info guard), which
    # mypy rejects as a syntax error under our pinned `python_version =
    # "3.10"` (see [tool.mypy] below) -- it aborts the whole run before any
    # of our own code is even checked. 2.2.x's stubs predate that change.
    "numpy>=1.24,<2.3",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # Not a test tool -- a test *dependency*. The faces tests, and the
    # dashboard tests that build face fixtures, import numpy at module scope,
    # so without it here the documented `uv sync --extra dev` install cannot
    # even collect the suite (16 collection errors, including two non-faces
    # dashboard files). onnxruntime deliberately stays out: tests that need a
    # real session `importorskip` it, so the suite runs green without the
    # 200 MB runtime. Guarded by tests/test_packaging.py.
    # Same <2.3 upper bound as the faces extra above, and for the same
    # mypy/PEP-695-stub reason -- kept in sync deliberately.
    "numpy>=1.24,<2.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
imageharbor = "imageharbor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["imageharbor*"]

# setuptools installs ONLY .py files unless non-Python files are declared here.
# `dashboard/server.py` loads its page with `Path(__file__).parent /
# "index.html"`, so without this the module imports fine, `/api/stats` serves
# fine, and `GET /` returns "dashboard page unavailable" -- in the container
# only. Found in production on the first real deploy (2026-08-19): every test
# passed because the suite runs from the source tree, where index.html is on
# disk regardless of what the wheel contains. Any future non-.py runtime asset
# must be added here AND to tests/test_packaging.py.
[tool.setuptools.package-data]
imageharbor = ["dashboard/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# `corpus` matches the sibling Takeout_Inventory repo's own convention
# (tests/test_corpus.py there): opt-in, excluded by default, run explicitly
# with `pytest -m corpus`. A corpus test never asserts a count -- the real
# export is not a fixture and changes over time.
markers = [
    "corpus: runs against a real Google Takeout export on disk. Opt-in, never in CI.",
]
addopts = "--strict-markers -m \"not corpus\""

# Lint only in R1 -- no `ruff format`, no line-length rules: a wholesale
# reformat of 15k LOC is deliberate churn we are not buying in the same
# release that introduces CI. Rules: pyflakes + pycodestyle errors + import
# order + bugbear.
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

# Non-strict on purpose: the codebase is 99% return-annotated, so this
# baseline is cheap to keep green; ratchet toward strict in later releases.
[tool.mypy]
files = ["imageharbor"]
python_version = "3.10"
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "openai.*"]
ignore_missing_imports = true
