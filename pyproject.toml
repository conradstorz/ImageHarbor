[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imageharbor"
version = "0.1.0"
description = "Deterministic, resumable photo organization system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "Pillow>=10.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
faces = [
    "onnxruntime>=1.17,<2",
    "numpy>=1.24",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # Not a test tool -- a test *dependency*. The faces tests, and the
    # dashboard tests that build face fixtures, import numpy at module scope,
    # so without it here the documented `uv sync --extra dev` install cannot
    # even collect the suite (16 collection errors, including two non-faces
    # dashboard files). onnxruntime deliberately stays out: tests that need a
    # real session `importorskip` it, so the suite runs green without the
    # 200 MB runtime. Guarded by tests/test_packaging.py.
    "numpy>=1.24",
]

[project.scripts]
imageharbor = "imageharbor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["imageharbor*"]

# setuptools installs ONLY .py files unless non-Python files are declared here.
# `dashboard/server.py` loads its page with `Path(__file__).parent /
# "index.html"`, so without this the module imports fine, `/api/stats` serves
# fine, and `GET /` returns "dashboard page unavailable" -- in the container
# only. Found in production on the first real deploy (2026-08-19): every test
# passed because the suite runs from the source tree, where index.html is on
# disk regardless of what the wheel contains. Any future non-.py runtime asset
# must be added here AND to tests/test_packaging.py.
[tool.setuptools.package-data]
imageharbor = ["dashboard/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# `corpus` matches the sibling Takeout_Inventory repo's own convention
# (tests/test_corpus.py there): opt-in, excluded by default, run explicitly
# with `pytest -m corpus`. A corpus test never asserts a count -- the real
# export is not a fixture and changes over time.
markers = [
    "corpus: runs against a real Google Takeout export on disk. Opt-in, never in CI.",
]
addopts = "--strict-markers -m \"not corpus\""
