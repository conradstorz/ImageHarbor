name: Faces ONNX

# Cut out of ci.yml (R4 whole-branch review, pre-merge finding #1 - CRITICAL):
# release.yml triggers on the CI workflow's RUN-LEVEL conclusion, so any job
# failing inside ci.yml -- including a flaky 261 MB weights download -- would
# block every tag/Release/GHCR push. Keeping this job in its own workflow
# keeps CI's conclusion meaning "the five required legs passed", while this
# advisory job (real ONNX boundary: detect.py/embed.py, 0% covered by the
# default suite; cached, checksum-pinned weights) runs and reports
# independently, exactly as advisory as it always was.
#
# Sticky-cache failure mode: on a checksum mismatch the download step fails
# BEFORE the cache-save step runs, so the bad cached entry is never replaced
# and keeps being restored on every subsequent run. Recover by purging the
# stale entry from the repo's Actions cache (Settings -> Actions -> Caches,
# or `gh cache delete`) or by touching imageharbor/faces/models.py so the
# cache key (hashFiles of that file) changes.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  faces-onnx:
    # Advisory (not in branch protection): exercises the real ONNX boundary
    # (detect.py/embed.py, 0% covered by the default suite) with cached,
    # checksum-pinned weights. A registry/download flake must not gate merges.
    runs-on: ubuntu-latest
    env:
      IMAGEHARBOR_FACE_MODEL_DIR: ${{ github.workspace }}/.imageharbor-models
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev --extra faces
      - uses: actions/cache@v4
        with:
          path: ${{ env.IMAGEHARBOR_FACE_MODEL_DIR }}
          key: face-models-${{ hashFiles('imageharbor/faces/models.py') }}
      - run: uv run imageharbor faces models download --model-dir "$IMAGEHARBOR_FACE_MODEL_DIR"
      - name: Assert model weights were actually downloaded (R4 review Minor #7)
        run: |
          test -f "$IMAGEHARBOR_FACE_MODEL_DIR/face_detection_yunet_2023mar.onnx"
          test -f "$IMAGEHARBOR_FACE_MODEL_DIR/auraface_v1_glintr100.onnx"
      - run: uv run pytest tests/faces/test_detect.py tests/faces/test_embed.py tests/faces/test_preprocess.py -v
