# ImageHarbor continuous watcher.
#
# Prerequisites on the Docker host (NOT in this file):
#   - Mount the NAS source share read-only, e.g. at /mnt/nas/photos
#   - Mount the NAS organized share read-write, e.g. at /mnt/nas/photos-organized
#     (via /etc/fstab or autofs; NAS credentials live there, not here.)
services:
  imageharbor:
    build: .
    image: imageharbor:latest
    command: watch
    environment:
      IMAGEHARBOR_SOURCE: /data/source
      IMAGEHARBOR_DEST: /data/dest
      IMAGEHARBOR_CATALOG: /data/catalog/catalog.db
      IMAGEHARBOR_INTERVAL: "300"
      IMAGEHARBOR_AI: openai
      IMAGEHARBOR_AI_BASE_URL: http://jetson.local:11434/v1
      IMAGEHARBOR_AI_MODEL: llava
      IMAGEHARBOR_AI_API_KEY: not-needed
      IMAGEHARBOR_AI_TIMEOUT: "60"
    ports:
      - "8080:8080"     # operational dashboard (see docs/superpowers/specs/2026-08-19-dashboard-design.md)
    volumes:
      - /mnt/nas/photos:/data/source:ro          # read-only source
      - /mnt/nas/photos-organized:/data/dest     # read-write organized library
      - imageharbor-catalog:/data/catalog        # local catalog volume (NOT on NAS)
    restart: unless-stopped
    # IMPORTANT finding #4 (2026-08-19 whole-branch review, pre-merge):
    # Docker's default stop_grace_period is 10s. A facts pass copying a
    # large file over a slow CIFS/NAS mount can easily outlast that, so a
    # plain `docker stop`/`docker compose down`/deploy restart would SIGKILL
    # the process mid-copy -- which also leaves that pass's `runs` row open
    # forever (see Catalog.run_started_by_this_process / stats._now_section's
    # "crashed_runs" in dashboard/stats.py, which now surfaces exactly this
    # on the dashboard after a restart). 60s gives SIGTERM time to let the
    # current file finish before SIGKILL lands.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  imageharbor-catalog:
