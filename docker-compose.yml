# ImageHarbor continuous watcher.
#
# Prerequisites on the Docker host (NOT in this file):
#   - Mount the NAS source share read-only, e.g. at /mnt/nas/photos
#   - Mount the NAS organized share read-write, e.g. at /mnt/nas/photos-organized
#     (via /etc/fstab or autofs; NAS credentials live there, not here.)
services:
  imageharbor:
    # Pulls the released image from GHCR (published automatically on every
    # green merge -- see .github/workflows/release.yml). To run a local
    # build instead: docker build -t ghcr.io/conradstorz/imageharbor:latest .
    image: ghcr.io/conradstorz/imageharbor:latest
    command: watch
    environment:
      IMAGEHARBOR_SOURCE: /data/source
      IMAGEHARBOR_DEST: /data/dest
      IMAGEHARBOR_CATALOG: /data/catalog/catalog.db
      IMAGEHARBOR_INTERVAL: "300"
      IMAGEHARBOR_AI: openai
      IMAGEHARBOR_AI_BASE_URL: http://jetson.local:11434/v1
      IMAGEHARBOR_AI_MODEL: llava
      IMAGEHARBOR_AI_API_KEY: not-needed
      IMAGEHARBOR_AI_TIMEOUT: "60"
      IMAGEHARBOR_FACES: "1"
      IMAGEHARBOR_FACE_MODEL_DIR: /data/models
      IMAGEHARBOR_FACE_THRESHOLD: ""     # set from `faces calibrate` output
      # Dashboard exposure (R2): inside the container the server must bind
      # 0.0.0.0 for the published port to work; exposure is bounded by the
      # host's own network access (Traefik on hpz440, see the traefik.*
      # labels below). The token gates every mutating request; the allowlist
      # is the DNS-rebinding defense and must name every hostname the
      # dashboard is reached as, including the Traefik route -- a request
      # forwarded by Traefik still carries the original Host header, so the
      # allowlist sees "images.hpz440.ohr3023.org", not Traefik's own name.
      IMAGEHARBOR_DASHBOARD_HOST: 0.0.0.0
      IMAGEHARBOR_DASHBOARD_TOKEN: ""          # REQUIRED: set a long random string before `up`
      IMAGEHARBOR_DASHBOARD_ALLOWED_HOSTS: ""  # e.g. "100.69.239.123,hpz440,images.hpz440.ohr3023.org"
    labels:
      traefik.enable: "true"
      traefik.http.routers.images.rule: Host(`images.hpz440.ohr3023.org`)
      traefik.http.services.images.loadbalancer.server.port: "8080"
      harbor.description: "ImageHarbor"
    networks:
      - harbor
      - default
    volumes:
      - /mnt/nas/photos:/data/source:ro          # read-only source
      - /mnt/nas/photos-organized:/data/dest     # read-write organized library
      - imageharbor-catalog:/data/catalog        # local catalog volume (NOT on NAS)
      - imageharbor-models:/data/models          # face model weights (261 MB, downloaded once)
    restart: unless-stopped
    # IMPORTANT finding #4 (2026-08-19 whole-branch review, pre-merge):
    # Docker's default stop_grace_period is 10s. A facts pass copying a
    # large file over a slow CIFS/NAS mount can easily outlast that, so a
    # plain `docker stop`/`docker compose down`/deploy restart would SIGKILL
    # the process mid-copy -- which also leaves that pass's `runs` row open
    # forever (see Catalog.run_started_by_this_process / stats._now_section's
    # "crashed_runs" in dashboard/stats.py, which now surfaces exactly this
    # on the dashboard after a restart). 60s gives SIGTERM time to let the
    # current file finish before SIGKILL lands.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  harbor:
    external: true

volumes:
  imageharbor-catalog:
  imageharbor-models:
